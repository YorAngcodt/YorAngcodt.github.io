<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yordan Anggi | Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-gray-900/80 backdrop-blur p-4 z-50">
    <div class="max-w-4xl mx-auto flex justify-between">
      <h1 class="font-bold text-xl">Yordan</h1>
      <div class="flex gap-6">
        <a href="#home" class="hover:text-purple-400">Home</a>
        <a href="#about" class="hover:text-purple-400">About</a>
        <button id="themeBtn" class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">🌙</button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="min-h-screen flex flex-col justify-center items-center text-center px-6">
    <h1 class="text-5xl font-bold mb-4">
      Hi, I'm <span class="text-purple-400">Yordan Anggi</span>
    </h1>
    <p id="typingText" class="text-gray-400 text-xl mb-6"></p>
    <a href="https://github.com/YorAngcodt/YorAngcodt.github.io" target="_blank"
      class="px-6 py-3 bg-purple-600 rounded-full hover:bg-purple-700 transition">
      <i class="fab fa-github mr-2"></i> GitHub
    </a>
  </section>

  <!-- About Section -->
  <section id="about" class="py-20 px-6 max-w-3xl mx-auto text-center">
    <h2 class="text-3xl font-bold mb-4">About Me</h2>
    <p class="text-gray-400 leading-relaxed">
      I'm a student in Software Developer who enjoys Linux, networking, and cybersecurity.
    </p>
  </section>

  <script src="script.js"></script>
</body>
</html>
